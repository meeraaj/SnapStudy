[project]
name = "notes-service"
version = "0.1.0"
description = "SnapStudy Notes Service — Photo-Notes CRUD, Azure Blob, OCR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "azure-storage-blob>=12.24.0",
    "azure-ai-formrecognizer>=3.3.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
