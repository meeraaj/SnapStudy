[project]
name = "api-gateway"
version = "0.1.0"
description = "SnapStudy API Gateway — routes requests to microservices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.10.0",
    "passlib[bcrypt]>=1.7.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
