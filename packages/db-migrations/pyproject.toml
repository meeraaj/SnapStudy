[project]
name = "db-migrations"
version = "0.1.0"
description = "SnapStudy — Centralized Alembic database migrations"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
