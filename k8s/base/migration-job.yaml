apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: migrate
          image: snapstudyacr.azurecr.io/api-gateway:latest
          command: ['python', '-c', 'from src.database import init_db; init_db(); print("DB initialized")']
          envFrom:
            - secretRef:
                name: snapstudy-secrets
